<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Pixels</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12131c;--panel:#1d1f2e;--off:#2a2d40;--ink:#eceefb;--muted:#9aa0c0;--unk:#6b7090;--pur:#a855f7;--gre:#22c55e;--red:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 4px;font-size:28px}
.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.word{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.g{--c:clamp(6px,2.1vw,10px);display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);gap:1px;padding:5px;border-radius:6px;background:var(--panel)}
.g i{display:block;border-radius:1px;background:var(--off)}
.g i.unk{background:var(--unk)}
.g i.gre{background:var(--gre)}
.g i.red{background:var(--red)}
.g i.pur{background:var(--pur)}
.ref{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:18px}
.ref .line{display:flex;gap:3px;justify-content:center}
.ref .g{--c:clamp(2px,.8vw,3px);padding:1px}
.ref .g i.lit{background:var(--ink)}
.hist .word{margin-bottom:8px}
.hist .g{--c:5px;padding:3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--muted);margin:0 auto 18px;max-width:380px;text-align:left}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}
input{font:inherit;font-size:20px;letter-spacing:4px;text-transform:uppercase;width:160px;padding:10px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);text-align:center}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:26px;font-weight:600;margin:12px 0}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:360px;margin:0 auto;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
</style>
</head>
<body>
<main>
  <h1>Word Pixels</h1>
  <p class="sub">Every letter is made of pixels. Use the pixel clues to find the secret word.</p>
  <div class="ref" id="ref" aria-label="Pixel alphabet reference"></div>
  <div class="word" id="board" aria-label="Secret word"></div>
  <div class="legend">
    <span><i style="background:var(--pur)"></i>letter is right</span>
    <span><i style="background:var(--unk)"></i>unknown for now</span>
    <span><i style="background:var(--gre)"></i>this spot must have this pixel</span>
    <span><i style="background:var(--red)"></i>this spot must not have this pixel</span>
  </div>
  <div class="row"><input id="g" autocomplete="off" autocapitalize="characters" aria-label="Your guess"><button id="go">Guess</button></div>
  <div id="msg" role="status"></div>
  <div class="row" style="margin-bottom:18px"><button class="ghost" id="new">New word</button><button class="ghost" id="give">Give up</button></div>
  <div class="hist" id="hist"></div>
</main>
<script>
const SRC={A:"01110,10001,10001,11111,10001,10001,10001",B:"11110,10001,10001,11110,10001,10001,11110",C:"01110,10001,10000,10000,10000,10001,01110",D:"11110,10001,10001,10001,10001,10001,11110",E:"11111,10000,10000,11110,10000,10000,11111",F:"11111,10000,10000,11110,10000,10000,10000",G:"01110,10001,10000,10111,10001,10001,01111",H:"10001,10001,10001,11111,10001,10001,10001",I:"01110,00100,00100,00100,00100,00100,01110",J:"00111,00010,00010,00010,00010,10010,01100",K:"10001,10010,10100,11000,10100,10010,10001",L:"10000,10000,10000,10000,10000,10000,11111",M:"10001,11011,10101,10101,10001,10001,10001",N:"10001,11001,10101,10011,10001,10001,10001",O:"01110,10001,10001,10001,10001,10001,01110",P:"11110,10001,10001,11110,10000,10000,10000",Q:"01110,10001,10001,10001,10101,10010,01101",R:"11110,10001,10001,11110,10100,10010,10001",S:"01111,10000,10000,01110,00001,00001,11110",T:"11111,00100,00100,00100,00100,00100,00100",U:"10001,10001,10001,10001,10001,10001,01110",V:"10001,10001,10001,10001,10001,01010,00100",W:"10001,10001,10001,10101,10101,10101,01010",X:"10001,10001,01010,00100,01010,10001,10001",Y:"10001,10001,01010,00100,00100,00100,00100",Z:"11111,00001,00010,00100,01000,10000,11111"};
const FONT={};for(const k in SRC)FONT[k]=SRC[k].split(",").map(r=>[...r].map(c=>c==="1"));
const WORDS={3:"CAT DOG SUN MAP BOX FOX HAT PEN CUP BED KEY ICE EGG JAM OWL ZOO SKY TOY BAG BUS CAR COW CRY CUT DAY EAR EYE FAN FIG FLY GUM HEN HOT INK JAR JET KIT LAP LEG LID MAT MUD NET NUT OIL PAN PEA PIE PIG RAT RED RUG SAD SEA TEA TIE TOP VAN WEB YAK ZIP".split(" "),4:"MOON STAR FISH BIRD CAKE LAMP ROAD KING JUMP QUIZ WAVE GOLD FROG BEAR BOAT BOOK CAMP CITY CORN DESK DOOR DUCK FARM FIRE FOOT GAME GIFT HAND HILL HOME IRON JAZZ KITE LAKE LEAF LION MILK NEST NOTE PARK RAIN RICE RING ROCK ROSE SAND SEED SHIP SILK SNOW SOUP SONG TREE WIND WOOL ZERO BELL BONE BOWL CLAY COAT DRUM FLAG GATE GLUE GRID HAWK HOLE JUNK KNOB LOCK MASK MINT OVEN PEAR PLUM POND RAFT SALT SOAP TENT TOWN VASE WALL YARD".split(" "),5:"PLANT CRANE STONE BRAIN CLOUD FLAME GRAPE HOUSE LIGHT MONEY NIGHT OCEAN PAINT QUIET RIVER SMILE TABLE WATER YOUNG ANGEL BEACH CHAIR DREAM EARTH FIELD GLASS HEART JUICE KNIFE LEMON MUSIC NORTH PIANO QUEEN ROUND SUGAR TRAIN UNDER VOICE WORLD BREAD CANDY DANCE EAGLE FRUIT GHOST HONEY LUNCH MOUNT PEACH SHEEP TIGER WHEAT ZEBRA STORM BLEND CRISP DRIFT FROST GRAIN SPARK APPLE BADGE BENCH BLOOM BOARD BRUSH CABIN CLOCK CORAL CROWN DAISY DOZEN FENCE FLOOR FLUTE GIANT GRASS HOTEL IGLOO JELLY KOALA LLAMA LUCKY MANGO MAPLE MARCH NOVEL OLIVE ONION OTTER PANDA PEARL PILOT PIZZA PLAZA QUILT RADIO RANCH ROBOT SALAD SCARF SHELL SKATE SMOKE SNAKE SPOON STAMP STEAM SWEET TOAST TOWER UNCLE VIDEO WHALE YACHT".split(" "),6:"GARDEN SILVER BRIDGE CASTLE FLOWER FOREST ISLAND JUNGLE MARKET ORANGE PLANET RABBIT SUMMER WINTER YELLOW BASKET CANDLE DINNER FRIEND GUITAR HAMMER INSECT JACKET KITTEN MIRROR NEEDLE PENCIL POCKET SCHOOL SPIRIT TICKET VALLEY WINDOW BUTTER CIRCLE DOCTOR ENGINE FINGER GOLDEN LISTEN MOMENT ANIMAL BOTTLE BRANCH BUBBLE CAMERA CARPET CHERRY COOKIE DESERT DRAGON FABRIC FOLDER GINGER HELMET JERSEY KETTLE MEADOW MONKEY MUSEUM NUMBER OYSTER PEPPER PILLOW POTATO PURPLE RIBBON SAILOR SALMON SHADOW SPIDER SPRING SQUARE TEMPLE TOMATO TUNNEL TURTLE VIOLIN WALLET WIZARD ZIPPER".split(" ")};
const $=id=>document.getElementById(id);
let secret,n,st,solved,tries,over,round=0;
function grid(fn){let h='<div class="g">';for(let r=0;r<7;r++)for(let c=0;c<5;c++)h+=`<i class="${fn(r,c)}"></i>`;return h+"</div>"}
$("ref").innerHTML=["ABCDEFGHIJKLM","NOPQRSTUVWXYZ"].map(l=>`<div class="line">${[...l].map(ch=>grid((r,c)=>FONT[ch][r][c]?"lit":"")).join("")}</div>`).join("");
function drawBoard(){
  $("board").innerHTML=[...secret].map((ch,i)=>grid((r,c)=>{
    if(solved[i]||over)return FONT[ch][r][c]?"pur":"";
    return ["unk","gre","red"][st[i][r*5+c]];
  })).join("");
}
function guessRow(w){
  return `<div class="word">${[...w].map((ch,i)=>{
    const ok=ch===secret[i];
    return grid((r,c)=>{
      if(!FONT[ch][r][c])return "";
      if(ok)return "pur";
      const has=FONT[secret[i]][r][c];
      st[i][r*5+c]=has?1:2;
      return has?"gre":"red";
    });
  }).join("")}</div>`;
}
function start(){
  round++;
  n=3+Math.floor(Math.random()*4);
  const list=WORDS[n];secret=list[Math.floor(Math.random()*list.length)];
  st=Array.from({length:n},()=>Array(35).fill(0));solved=Array(n).fill(false);tries=0;over=false;
  $("hist").innerHTML="";$("msg").textContent="";
  $("g").value="";$("g").maxLength=n;$("g").disabled=false;$("go").disabled=false;
  drawBoard();$("g").focus();
}
function guess(){
  if(over)return;
  const w=$("g").value.toUpperCase().trim();
  if(!new RegExp(`^[A-Z]{${n}}$`).test(w)){$("msg").textContent=`Type exactly ${n} letters.`;return}
  tries++;
  $("hist").insertAdjacentHTML("afterbegin",guessRow(w));
  for(let i=0;i<n;i++)if(w[i]===secret[i])solved[i]=true;
  $("g").value="";
  if(solved.every(Boolean)){
    over=true;$("g").disabled=true;$("go").disabled=true;
    $("msg").innerHTML=`<div class="win">You won round ${round}!</div>`;
    drawBoard();confetti();
  }else{
    $("msg").textContent=`Guess ${tries}. Keep going!`;
    drawBoard();$("g").focus();
  }
}
function giveUp(){
  if(over)return;
  over=true;$("g").disabled=true;$("go").disabled=true;
  $("msg").textContent=`You gave up. The word was ${secret}.`;drawBoard();
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
$("go").onclick=guess;
$("g").onkeydown=e=>{if(e.key==="Enter")guess()};
$("give").onclick=giveUp;
$("new").onclick=start;
start();
</script>
</body>
</html>
